<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muhammad Ali</title>
<meta name="description" content="Muhammad Ali — machine learning research at William & Mary. Ask about my research, projects and coursework.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --card:#ffffff; --ink:#111111; --muted:#6b6b6b; --faint:#a3a3a3;
  --line:rgba(0,0,0,.1); --bubble:#f2f2f2; --side:#fafafa;
  --accent:199,146,46;
  --serif:"Newsreader",Georgia,serif; --sans:"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b0b0b; --card:#161616; --ink:#f2f2f2; --muted:#9a9a9a; --faint:#5f5f5f; --line:rgba(255,255,255,.12); --bubble:#1e1e1e; --side:#101010; }
}
:root[data-theme="dark"]{ --bg:#0b0b0b; --card:#161616; --ink:#f2f2f2; --muted:#9a9a9a; --faint:#5f5f5f; --line:rgba(255,255,255,.12); --bubble:#1e1e1e; --side:#101010; }
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;
  display:grid;grid-template-columns:264px minmax(0,1fr);height:100vh;height:100dvh}
a{color:inherit}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;width:30px;height:30px;cursor:pointer;font-size:13px;flex:none}

/* sidebar: a table of contents styled like saved conversations */
.side{display:flex;flex-direction:column;min-height:0;background:var(--side);border-right:1px solid var(--line);padding:18px 12px 14px}
.brand{font:400 20px var(--serif);text-decoration:none;padding:0 8px}
.new{margin:16px 0 18px;display:flex;align-items:center;gap:8px;width:100%;font:500 13.5px var(--sans);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.new:hover{border-color:var(--ink)}
.links{display:flex;flex-direction:column;gap:2px}
/* styled like a list of previous chats: one plain line each, highlight on hover */
.link-item{display:block;font:400 14px var(--sans);color:var(--ink);text-decoration:none;border-radius:8px;padding:8px 10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-item:hover{background:var(--bubble)}
.menu-btn{display:none}
.theme-btn{position:absolute;top:14px;right:16px;z-index:2}

.main{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;min-width:0}
.col{width:min(720px,100% - 32px);margin:0 auto}
.main h1{font:400 clamp(18px,2vw,26px)/1.3 var(--serif);letter-spacing:-.01em;margin:24px auto 0;padding:0 36px;text-wrap:balance;text-align:center}
h1 em{color:rgb(var(--accent));transition:color .6s}

/* before the first question: headline, box and suggestions sit together, centered on the page */
body.empty .main{grid-template-rows:1fr auto 1.3fr}
body.empty .log{display:none}
body:not(.empty) .chips{display:none}   /* the sidebar covers navigation once the chat has started */
body.empty h1{align-self:end;font-size:clamp(24px,3vw,36px);margin-bottom:28px}
body.empty .chips{order:2;flex-wrap:wrap;justify-content:center;padding:14px 0 0}
body.empty .note{order:3;margin-top:14px}
.dock{display:flex;flex-direction:column}
.log{animation:fade .4s both}
@keyframes fade{from{opacity:0}}
.tag{font:500 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}

.log{overflow-y:auto;padding:24px 0 12px;display:flex;flex-direction:column;gap:18px;scrollbar-width:thin}
.msg{font-size:15px;line-height:1.65}
.msg.user{align-self:flex-end;background:var(--bubble);padding:8px 14px;border-radius:18px;max-width:80%}
.msg p{margin:0 0 8px}
.msg p:last-child{margin-bottom:0}
.msg .k{color:var(--muted)}
.caret::after{content:"▍";color:var(--faint);animation:blink .8s infinite;margin-left:1px}
@keyframes blink{50%{opacity:.2}}
.msg a.link{color:rgb(var(--accent));text-underline-offset:3px}

.dock{padding:0 0 14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.suggest{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{flex:none;font:400 13px var(--sans);color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip:hover{color:var(--ink);border-color:var(--ink)}
form{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:6px 6px 6px 18px;box-shadow:0 8px 30px -18px rgba(0,0,0,.25)}
form:focus-within{border-color:var(--ink)}
input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:400 15px var(--sans);padding:8px 0}
input::placeholder{color:var(--faint)}
form button{width:36px;height:36px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:16px;cursor:pointer}
form button:disabled{opacity:.3;cursor:default}
.note{text-align:center;font-size:11.5px;color:var(--faint);margin-top:8px}

.cand{color:rgba(var(--accent),.6)}   /* a briefly sampled alternative word */

@media (max-width:760px){
  body{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(290px,86vw);z-index:5;transform:translateX(-100%);transition:transform .25s}
  body.nav-open .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .menu-btn{display:grid;place-items:center;position:absolute;top:12px;left:12px;z-index:2}
  .main h1{margin-top:54px;font-size:17px}
  body.empty h1{font-size:22px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="empty">

<aside class="side" id="side">
  <a class="brand" href="./">Muhammad Ali</a>
  <button class="new" id="new" type="button">＋ New chat</button>
  <nav class="links" aria-label="Links">
    <a class="link-item" href="https://mvhammad.github.io/assets/resume/Muhammad_Ali_Resume.pdf" target="_blank" rel="noopener">Résumé</a>
    <a class="link-item" href="https://github.com/mvhammad" target="_blank" rel="noopener">GitHub</a>
    <a class="link-item" href="https://www.linkedin.com/in/muhammad-ali-544477187/" target="_blank" rel="noopener">LinkedIn</a>
    <a class="link-item" href="mailto:maali@wm.edu">Email</a>
  </nav>
</aside>

<div class="main">
<button class="icon-btn menu-btn" id="menu" type="button" aria-label="Open menu">☰</button>
<button class="icon-btn theme-btn" id="theme" type="button" aria-label="Toggle dark mode" title="Toggle theme">◐</button>

<h1 class="col">I'm an aspiring machine learning researcher focused on understanding and building <em>learning systems</em>.</h1>

<main class="log col" id="log" aria-live="polite"></main>

<div class="dock col">
  <div class="chips" id="chips"></div>
  <form id="ask">
    <input id="q" autocomplete="off" placeholder="Ask about my research, projects or courses…" aria-label="Ask a question">
    <button id="send" aria-label="Send">↑</button>
  </form>
  <div class="note">Answers are written by me and matched to your question. No AI model is called.</div>
</div>
</div>

<script>
/* ============ CONTENT — edit everything here ============ */
const COLORS = { research:[199,146,46], projects:[185,121,102], math:[138,122,154], cs:[111,135,150] };

const RESUME = "https://mvhammad.github.io/assets/resume/Muhammad_Ali_Resume.pdf";

// Each topic: keywords that trigger it, its color, and the answer (one string per paragraph).
// Details live on the résumé; answers summarize and point there.
const TOPICS = [
  { id:"resampling", color:"research",
    keys:["resampling","resample","token","tokens","sampling","ppot","probabilistic","inference","autoregressive"],
    answer:["Through my SEMERU research, I study Probabilistic Programs of Thought (PPoT), which gets more program samples from fewer LLM forward passes by resampling saved next-token distributions.",
            "The open question is when that shortcut is safe: PPoT assumes changing one token barely shifts the distributions after it, and I'm testing when that independence approximation holds."] },
  { id:"interventions", color:"projects",
    keys:["intervention","interventions","jensen","shannon","divergence","qwen","gsm8k","regression","predict","predicting","prediction","swap","swaps","learning"],
    answer:["My Statistical Learning project (MATH 455/555, Fall 2026) asks whether observable features of a single token intervention can predict how far an LLM’s later next-token distributions shift.",
            "I measured that shift as Jensen-Shannon divergence after a controlled token swap in Qwen2.5-Coder-0.5B on a GSM8K problem, and I’m modeling it with regularized regression, tree ensembles and cross-validation."] },
  { id:"graph", color:"projects",
    keys:["graph","graphs","theory","dependency","dependencies","monorepo","medusa","centrality","betweenness","scc","repository","repo","agent","agents","coding"],
    answer:["My Graph Theory project (MATH 332, Fall 2026) models the Medusa e-commerce monorepo as a dependency graph: each source file is a vertex, with an edge to every file it imports.",
            "I’m using betweenness centrality, strongly connected components and cut vertices to find structural bottlenecks, toward a broader question: can a repository’s dependency graph give LLM coding agents context that text similarity can’t?"] },
  { id:"bear", color:"projects",
    keys:["bear","bears","wildlife","kenai","classifier","resnet","image","vision","camera","cv"],
    answer:["For my Neural Networks course (CSCI 446/546), I built an image classifier that tells individual brown bears apart in camera-trap footage from Kenai National Wildlife Refuge.",
            "I fine-tuned an ImageNet-pretrained ResNet-50 with data augmentation, and grouped five-fold cross-validation by source video so near-identical frames couldn't leak between training and validation. Built with Python and TensorFlow/Keras."] },
  { id:"homology", color:"projects",
    keys:["homology","topology","topological","tda","persistent","manifold","vietoris","rips"],
    answer:["For CSCI 476/576, I studied how well persistent homology recovers the topology of a sinusoidal manifold from a finite, noisy sample.",
            "I generated point clouds with varying sample sizes, noise levels and sampling distributions, built Vietoris–Rips filtrations, and separated real topological structure from artifacts of sampling and noise, while tracking runtime and memory for reproducibility."] },
  { id:"site", color:"projects",
    keys:["website","site","page","chat","chatbot","portfolio"],
    answer:["This site is hand-built HTML, CSS and JavaScript on GitHub Pages. The chat matches your question against answers I wrote, so it can't make anything up about me."] },
  { id:"research", color:"research",
    keys:["research","researching","lab","semeru","llm","llms","language","generation","reasoning","poshyvanyk","working","paper","experience","ml","ai","machine"],
    answer:["I'm an undergraduate research assistant in the SEMERU Research Group at William & Mary, working with Prof. Denys Poshyvanyk on large language models and AI for software engineering.",
            "I'm studying probabilistic approaches to LLM reasoning and generation, including token-level sampling and autoregressive dependencies."] },
  { id:"projects", color:"projects",
    keys:["project","projects","built","build","made","work"],
    answer:["What I’ve worked on, newest first:",
            "PPoT research (in progress): when saved next-token distributions can stand in for new LLM forward passes.",
            "Token Intervention Prediction (Statistical Learning, Fall 2026): predicting how far a token swap shifts an LLM’s later distributions.",
            "Monorepo Dependency Graphs (Graph Theory, Fall 2026): the structure of a large codebase as a graph, for LLM coding agents.",
            "Persistent Homology of Manifolds (Spring 2026): how well topology survives finite, noisy sampling.",
            "Individual Bear Classification (Fall 2025): telling brown bears apart in camera-trap footage with a fine-tuned ResNet-50.",
            `Ask about any of them, or see my [résumé](${RESUME}).`] },
  { id:"math", color:"math",
    keys:["math","mathematics","analysis","probability","statistics","statistical","algebra","graph","measure","proof","proofs","theory"],
    answer:["My math centers on probability, statistics, analysis and linear algebra: Real Analysis, Abstract Linear Algebra, Probability, Mathematical Statistics, Statistical Learning and Graph Theory & Applications, with Measure Theory planned.",
            `The full list is on my [résumé](${RESUME}).`] },
  { id:"cs", color:"cs",
    keys:["cs","computer","algorithm","algorithms","programming","software","neural","network","networks","geometry","engineering","mining"],
    answer:["On the computer science side: Fundamentals of AI/ML, Neural Networks, High-Dimensional Geometry of Data and Software Engineering, with Data Mining, Large Language Models and Generative AI for Software Development planned.",
            `The full list is on my [résumé](${RESUME}).`] },
  { id:"current", color:"research",
    keys:["semester","now","currently","taking","fall","this"],
    answer:[`Right now I’m focused on my SEMERU research, a Statistical Learning project on token interventions in LLMs, and a Graph Theory project on software dependency graphs. My coursework is on my [résumé](${RESUME}).`] },
  { id:"planned", color:"research",
    keys:["next","spring","plan","planned","planning","future"],
    answer:["Next I plan to take Measure Theory, Data Mining, Large Language Models and Generative AI for Software Development."] },
  { id:"education", color:"research",
    keys:["school","college","university","major","degree","study","studying","william","mary","education","courses","classes","coursework"],
    answer:["I'm studying for a B.S. in Computational & Applied Mathematics & Statistics at William & Mary.",
            `Ask about my math or computer science coursework, or see the full list on my [résumé](${RESUME}).`] },
  { id:"skills", color:"cs",
    keys:["skill","skills","languages","python","tools","stack","tech","library","libraries","tensorflow","keras","numpy","pandas","know"],
    answer:["Languages: Python, R, TypeScript and LaTeX.",
            "Tools: Git, GitHub, VS Code, Jupyter and Linux/WSL.",
            "ML and data: NumPy, pandas, Matplotlib, scikit-learn and TensorFlow/Keras."] },
  { id:"contact", color:"research",
    keys:["contact","email","reach","hire","hiring","linkedin","connect","talk","touch","resume","cv","résumé"],
    answer:[`Email is best: [maali@wm.edu](mailto:maali@wm.edu). I'm also on [LinkedIn](https://www.linkedin.com/in/muhammad-ali-544477187/) and [GitHub](https://github.com/mvhammad), and my [résumé](${RESUME}) has everything in one page, with links to my projects.`] },
  { id:"intro", color:"research",
    keys:["who","yourself","hi","hello","hey","background","introduce","muhammad"],
    answer:["I'm Muhammad Ali, a Computational & Applied Mathematics & Statistics student at William & Mary and an undergraduate researcher working on large language models.",
            "Ask about my research, projects, coursework or skills."] },
];
const FALLBACK = ["I only know about my own research, projects, coursework and skills. Try one of these:"];
// The small colored label above each answer.
const TAGS = { resampling:"Research", interventions:"Projects", graph:"Projects", bear:"Projects", homology:"Projects", site:"Projects", projects:"Projects", research:"Research",
  math:"Mathematics", cs:"Computer Science", current:"Coursework", planned:"Coursework", education:"Education",
  skills:"Skills", contact:"Contact", intro:"About" };
const CHIPS = ["What are you researching?","What is token resampling?","Show me your projects","What math have you taken?","How can I reach you?"];

/* ============ MATCHING ============ */
// shortcut: keyword overlap, not real understanding; swap in an embedding or LLM backend if visitors ask things it misses
const norm = w => w.length > 3 ? w.replace(/s$/,"") : w;
// true when a and b differ by at most one inserted, deleted or changed letter ("reserch" ~ "research")
function near(a, b){
  if (Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, edits = 0;
  while (i < a.length && j < b.length){
    if (a[i] === b[j]){ i++; j++; continue; }
    if (++edits > 1) return false;
    if (a.length > b.length) i++; else if (a.length < b.length) j++; else { i++; j++; }
  }
  return edits + (a.length - i) + (b.length - j) <= 1;
}
function pick(q){
  const words = [...new Set((q.toLowerCase().match(/[a-zé0-9+#]+/g) || []).map(norm))];
  // typos only on words of 6+ letters: shorter ones collide too easily ("taken" ~ "token")
  const hit = k => words.includes(k) || (k.length >= 6 && words.some(w => w.length >= 6 && near(w, k)));
  let best = null, top = 0;
  for (const t of TOPICS){
    const s = [...new Set(t.keys.map(norm))].filter(hit).length;
    if (s > top){ best = t; top = s; }   // ties go to the earlier, more specific topic
  }
  return best;
}
console.assert(pick("What are you researching?").id==="research", "research");
console.assert(pick("Tell me about the bear project").id==="bear", "bear");
console.assert(pick("What math have you taken?").id==="math", "math");
console.assert(pick("What are you taking this semester?").id==="current", "current");
console.assert(pick("Who are you?").id==="intro", "intro");
console.assert(pick("asdf qwerty")===null, "fallback");
console.assert(pick("Do you like cats?")===null, "no stray intro match");
console.assert(pick("Tell me about your ML experience").id==="research", "ml");
console.assert(pick("reserch experience").id==="research", "typo");
console.assert(pick("What mathematics courses?").id==="math", "math over education");
console.assert(pick("What is token resampling?").id==="resampling", "resampling");
console.assert(pick("Tell me about PPoT").id==="resampling", "ppot");
console.assert(pick("What is your statistical learning project?").id==="interventions", "statistical learning project");
console.assert(pick("Tell me about the graph theory project").id==="graph", "graph theory project");
console.assert(pick("How do coding agents use dependency graphs?").id==="graph", "dependency graphs");
console.assert(pick("Show me your projects").id==="projects", "projects list");
console.assert(pick("What computer science have you taken?").id==="cs", "cs");
console.assert(pick("Tell me about your ML experience").id==="research", "ml still research");
/* ============ CHAT ============ */
const log = document.getElementById("log"), input = document.getElementById("q"), send = document.getElementById("send");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep = ms => new Promise(r=>setTimeout(r, reduceMotion ? 0 : ms));
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => esc(s).replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_,t,h)=>`<a class="link" href="${h}"${/^https?:/.test(h)?' target="_blank" rel="noopener"':""}>${t}</a>`);
const setAccent = rgb => document.documentElement.style.setProperty("--accent", rgb.join(","));
let busy = false;

function add(cls){ const d = document.createElement("div"); d.className = "msg " + cls; log.appendChild(d); return d; }
async function stream(el, paras){
  for (const para of paras){
    const p = document.createElement("p"); p.className = "caret"; el.appendChild(p);
    const plain = para.replace(/\[([^\]]+)\]\([^)]+\)/g, "$1");   // type the link text, then swap in the real links
    const pool = plain.match(/[A-Za-z]{4,}/g) || [];
    let acc = "";
    for (const tok of plain.match(/\S+\s*/g)){
      // like token sampling: some words briefly show a candidate from the same answer before the chosen one lands
      if (!reduceMotion && pool.length && Math.random() < 0.3){
        p.innerHTML = esc(acc) + `<span class="cand">${esc(pool[Math.random()*pool.length|0])}</span>`;
        await sleep(45);
      }
      acc += tok; p.textContent = acc; log.scrollTop = log.scrollHeight; await sleep(5 + Math.random()*10);
    }
    p.classList.remove("caret"); p.innerHTML = fmt(para);
  }
}
async function ask(q){
  q = q.trim(); if (!q || busy) return;
  busy = true; send.disabled = true; input.value = "";
  document.body.classList.remove("empty", "nav-open");
  add("user").textContent = q;
  const t = pick(q);
  if (t) setAccent(COLORS[t.color]);
  const bot = add("bot");
  if (t){
    const tag = document.createElement("div"); tag.className = "tag";
    tag.textContent = TAGS[t.id]; tag.style.color = `rgb(${COLORS[t.color]})`; bot.appendChild(tag);
  }
  await sleep(250);
  await stream(bot, t ? (typeof t.answer === "function" ? t.answer() : t.answer) : FALLBACK);
  if (!t){   // the suggestion row is hidden once a chat starts, so offer the suggestions inside the reply
    const row = document.createElement("div"); row.className = "suggest";
    for (const c of CHIPS){
      const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = c;
      b.onclick = ()=>ask(c); row.appendChild(b);
    }
    bot.appendChild(row); log.scrollTop = log.scrollHeight;
  }
  busy = false; send.disabled = false; input.focus({ preventScroll:true });
}

document.getElementById("ask").addEventListener("submit", e=>{ e.preventDefault(); ask(input.value); });
const chipsEl = document.getElementById("chips");
for (const c of CHIPS){
  const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = c;
  b.onclick = ()=>ask(c); chipsEl.appendChild(b);
}

document.getElementById("new").onclick = ()=>{
  if (busy) return;
  log.innerHTML = ""; document.body.classList.add("empty"); document.body.classList.remove("nav-open");
  setAccent(COLORS.research);
  input.focus({ preventScroll:true });
};
document.getElementById("menu").onclick = ()=>document.body.classList.toggle("nav-open");
document.querySelector(".main").addEventListener("click", e=>{ if (e.target.id !== "menu") document.body.classList.remove("nav-open"); });

const root = document.documentElement;
document.getElementById("theme").onclick = ()=>{
  const dark = root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
};
</script>
</body>
